<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobPilot account</title><style>body{background:#f5f7f4;color:#203c34;font:16px/1.6 system-ui;margin:0}main{max-width:520px;margin:40px auto;padding:25px}section{padding:24px;background:white;border:1px solid #dce5de;border-radius:16px;margin:20px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bdcdc2;box-sizing:border-box}input{width:100%;margin:6px 0 18px}button{background:#176148;color:white;cursor:pointer}a{color:#176148}</style><main><a href="/">← JobPilot</a><h1>Your account</h1><p id="state" role="status">Checking account setup…</p><section id="auth"><h2>Sign in or create an account</h2><form id="credentials"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label><button name="action" value="login">Sign in</button> <button name="action" value="signup">Create account</button></form></section><section id="vault" hidden><h2>Connect Groq once</h2><p>Your key is encrypted before storage and belongs only to your account. It is sent to Groq when you request AI rewriting. Use a free-tier key to avoid paid usage.</p><form id="keyForm"><label>Groq API key<input name="key" type="password" autocomplete="off" minlength="20" maxlength="300" required></label><button>Save key</button></form><p><button id="remove">Remove saved key</button> <button id="logout">Sign out</button></p></section><p id="result" role="status"></p></main><script src="/session.js"></script><script>
const $=id=>document.getElementById(id);
async function call(path,body,method='POST'){const r=await fetch('/api/account/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Please check your entries.');return data;}
async function state(){await window.jobpilotSessionReady;const d=await(await fetch('/api/account')).json();$('state').textContent=!d.configured?'Account storage is not connected yet. Please use the request-only demo for now.':d.signed_in?(d.key_saved?'Signed in. Your Groq key is saved.':'Signed in. Add your Groq key below.'):'Sign in to use a saved key. Sessions renew while you use JobPilot; saved keys remain available after sign-in.';$('auth').hidden=d.signed_in;$('vault').hidden=!d.signed_in;document.querySelectorAll('#auth button').forEach(b=>b.disabled=!d.configured);}
async function act(fn){try{$('result').textContent=(await fn()).message;await state();}catch(e){$('result').textContent=e.message;}}
$('credentials').onsubmit=e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const action=e.submitter.value;act(()=>call(action,body));e.target.elements.password.value='';};
$('keyForm').onsubmit=e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));act(()=>call('key',body));e.target.reset();};
$('remove').onclick=()=>act(()=>call('key',null,'DELETE'));$('logout').onclick=()=>act(()=>call('logout'));state().catch(()=>$('state').textContent='Unable to reach account service.');
</script></html>
